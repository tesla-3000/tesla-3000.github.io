# Sito Tesla3000 Società Cooperativa
# NOME: "Tesla3000 Società Cooperativa" (confermato). Per cambiarlo: params.brandName.
baseURL = "https://tesla3000.it/"
title = "Tesla3000"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  brandName = "Tesla3000"                 # <-- unico punto per il nome
  legalSuffix = "Società Cooperativa"     # ragione sociale = brandName + legalSuffix
  vatNumber = "03290730591"             # C.F. e P.IVA (visura 14/10/2025)
  legalName = "Tesla 3000 Società Cooperativa"
  pec = "tesla3000soccoop@pec.it"
  reaNumber = "REA LT-324740"
  address = "Via dei Martiri del Lavoro 12, 04010 Norma (LT)"
  email = "coop@tesla3000.it"
  whatsapp = ""                           # numero WhatsApp (formato 39XXXXXXXXXX)
  formEndpoint = ""                       # URL POST del modulo; vuoto = fallback mailto
  githubOrg = "tesla3000"

[languages]
  [languages.it]
    label = "Italiano"
    locale = "it-IT"
    contentDir = "content/it"
    weight = 1
    [languages.it.params]
      description = "Lavora con i tuoi clienti esteri senza partita IVA: diventi socio della cooperativa, vieni assunto con busta paga e noi gestiamo contratto, fatture e incassi."
  [languages.en]
    label = "English"
    locale = "en"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      description = "Work with your foreign clients without an Italian VAT number: become a member of the cooperative, get a payslip, and we handle contracts, invoices and collections."

[markup.goldmark.renderer]
  unsafe = false

[sitemap]
  changeFreq = "monthly"

[outputs]
  home = ["HTML"]
  section = ["HTML"]

[[languages.it.menus.main]]
  name = "Come funziona"
  url = "/come-funziona/"
  weight = 1
[[languages.it.menus.main]]
  name = "Servizi e prezzi"
  url = "/prezzi/"
  weight = 2
[[languages.it.menus.main]]
  name = "Articoli"
  url = "/articoli/"
  weight = 3
[[languages.it.menus.main]]
  name = "Cooperazione"
  url = "/cooperazione/"
  weight = 4
[[languages.it.menus.main]]
  name = "Contatti"
  url = "/contatti/"
  weight = 5
[[languages.en.menus.main]]
  name = "How it works"
  url = "/how-it-works/"
  weight = 1
[[languages.en.menus.main]]
  name = "Services & pricing"
  url = "/pricing/"
  weight = 2
[[languages.en.menus.main]]
  name = "Articles"
  url = "/articles/"
  weight = 3
[[languages.en.menus.main]]
  name = "Cooperation"
  url = "/cooperation/"
  weight = 4
[[languages.en.menus.main]]
